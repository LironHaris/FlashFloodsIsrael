# Summary of the model_1_3 family (all its lead times x the 5 test periods) - src/summarize_family_test_periods.py:
# models trained on 'flow'+'normal' hours, mean prediction of CV-sweep sets #1-#3, scored on only test hours labeled 'flow' or 'normal'.
# Derived mode: reports are rebuilt under summary_name/derived_reports/ (mask / ensemble mean) and
# NSE, flood events / peaks and hydrographs are all computed from them (no reuse of older outputs).
# Run: python src/summarize_family_test_periods.py --config configs/summarize_family_test_periods_model_1_3_flow_normal_avg3_eval_flow_normal.yml
summary_name: family_test_periods_model_1_3_flow_normal_avg3_eval_flow_normal
run_dir: ./runs/model_comparisons/
models: ['1_3_0', '1_3_3', '1_3_6', '1_3_12']
test_sets: ['2009_2010_2011', '2012_2013_2014', '2015_2016_2020', '2017_2018_2019', '2021_2022_2023']
model_config_pattern: configs/train_flow_normal_{model}_{member}_{test}.yml
ensemble_members: ['top1', 'top2', 'top3']
eval_flow_type_mask: flow_normal
flow_type_intervals_file: data/processed/flow_type_intervals.csv
existing_compare_label_pattern: fn_avg3_{model}
use_wandb: true
wandb_project: flash-floods-israel
