# One summary of the model_0 family (all its lead times x the 5 test periods) - src/summarize_family_test_periods.py:
# event hydrographs per test period (that test set's leads only), an NSE CDF of all leads x test periods with
# per-lead median curves, and the median over test periods of each event statistic per lead.
# Reuses existing reports / NSE_CDF_compare_test_periods / model_compare_eval outputs where they exist.
# Run: python src/summarize_family_test_periods.py --config configs/summarize_family_test_periods_model_0.yml
summary_name: family_test_periods_model_0
run_dir: ./runs/model_comparisons/
models: ['0_0', '0_3', '0_6', '0_12']
test_sets: ['2009_2010_2011', '2012_2013_2014', '2015_2016_2020', '2017_2018_2019', '2021_2022_2023']
model_config_pattern: configs/best_crossval_{model}_{test}.yml
# existing outputs to reuse (missing ones are simply recomputed)
existing_compare_dir_pattern: ./runs/model_comparisons/best_crossval_test_{test}
existing_compare_label_pattern: best_crossval_{model}
existing_nse_dir_pattern: ./runs/model_comparisons/NSE_CDF_compare_test_periods_{model}
use_wandb: true
